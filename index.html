
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aditya Rainbow Snake</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px 10px;
 display:flex;align-items:center;flex-direction:column;
 font-family:Arial,sans-serif;color:white;
 background:linear-gradient(135deg,#12052e,#061d35,#073d32);
}
h1{
 text-align:center;font-size:clamp(25px,6vw,38px);
 color:#5dffb1;text-shadow:0 0 18px #00ff9d;
 margin:5px 0;
}
.subtitle{color:#d6e6ff;text-align:center}
.panel{
 width:min(94vw,420px);display:flex;justify-content:space-between;
 gap:8px;margin:12px 0;font-weight:bold;
}
.stat{
 background:#ffffff12;border:1px solid #ffffff30;
 border-radius:12px;padding:10px;text-align:center;flex:1;
}
canvas{
 width:min(94vw,420px);height:auto;aspect-ratio:1;
 border:3px solid #57ffb0;border-radius:15px;
 box-shadow:0 0 24px #20ffad55;
 background:#071520;
}
.controls{
 display:flex;justify-content:center;flex-wrap:wrap;
 gap:8px;margin:13px 0;
}
button,select{
 padding:11px 15px;border:0;border-radius:10px;
 font-weight:bold;font-size:15px;cursor:pointer;
}
button{background:linear-gradient(135deg,#51ffc0,#36a8ff);color:#061629}
label{display:flex;align-items:center;gap:8px;color:white}
#message{min-height:24px;color:#ffdf78;text-align:center}
.dpad{
 display:grid;grid-template-columns:repeat(3,55px);
 grid-template-rows:repeat(2,45px);gap:5px;
}
.dpad button{padding:5px;font-size:22px}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .down{grid-column:2;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
small{color:#c9d9ed;text-align:center;margin:10px}
</style>
</head>
<body>

<h1>🌈 ADITYA SNAKE</h1>
<p class="subtitle">🍎 Fruits • 🎨 Rainbow Colors • ✨ Neon World</p>

<div class="panel">
 <div class="stat">🏆 स्कोर<br><span id="score">0</span></div>
 <div class="stat">⭐ रिकॉर्ड<br><span id="best">0</span></div>
 <div class="stat">🍓 फल<br><span id="eaten">0</span></div>
</div>

<canvas id="board" width="420" height="420"></canvas>

<div class="controls">
 <button onclick="startGame()">▶ शुरू / रीस्टार्ट</button>
 <button onclick="pauseGame()">⏸ रोकें</button>
</div>

<div class="controls">
 <label>🐍 साँप
 <select id="snakeColor" onchange="draw()">
  <option value="rainbow">🌈 Rainbow</option>
  <option value="#31ff70">💚 Green</option>
  <option value="#39d9ff">💙 Blue</option>
  <option value="#ff4fe1">💗 Pink</option>
  <option value="#ffe94a">💛 Yellow</option>
  <option value="#ff702e">🧡 Orange</option>
  <option value="#b48aff">💜 Purple</option>
 </select></label>
</div>

<div class="dpad">
 <button class="up" onclick="turn(0,-1)">⬆️</button>
 <button class="left" onclick="turn(-1,0)">⬅️</button>
 <button class="down" onclick="turn(0,1)">⬇️</button>
 <button class="right" onclick="turn(1,0)">➡️</button>
</div>

<p id="message">शुरू करो दबाओ और फल खाना शुरू करो!</p>
<small>कंप्यूटर: Arrow Keys / WASD • मोबाइल: नीचे के बटन</small>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
const N=21,C=20;
const emojis=["🍎","🍌","🍊","🍇","🍓","🍉","🍍","🥝","🍒","🥭","🍐","🫐","🍑","🍋","🥥","🍈"];
const backgrounds=["#071520","#1a1033","#10251b","#291321","#102337"];
let snake,food,dx,dy,score,eaten,timer;
let running=false,paused=false,ended=true;
let best=Number(localStorage.getItem("adityaRainbowBest")||0);
document.getElementById("best").textContent=best;

function placeFood(){
 if(snake.length>=N*N)return;
 do{
  food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),
        emoji:emojis[Math.floor(Math.random()*emojis.length)],
        color:`hsl(${Math.random()*360},100%,65%)`};
 }while(snake.some(p=>p.x===food.x&&p.y===food.y));
}

function startGame(){
 clearInterval(timer);
 snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
 dx=1;dy=0;score=0;eaten=0;
 running=true;paused=false;ended=false;
 updateStats();placeFood();
 document.getElementById("message").textContent="फल खाओ और स्कोर बढ़ाओ! 🚀";
 draw();timer=setInterval(step,125);
}

function pauseGame(){
 if(!running&&!paused)return;
 if(running){clearInterval(timer);running=false;paused=true;
  document.getElementById("message").textContent="गेम रुका हुआ है ⏸";}
 else if(paused){running=true;paused=false;
  document.getElementById("message").textContent="चलो खेलते हैं! 🎮";
  timer=setInterval(step,125);}
 draw();
}

function turn(x,y){
 if(!running)return;
 if(x===-dx&&y===-dy)return;
 dx=x;dy=y;
}
document.addEventListener("keydown",e=>{
 const keys={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],
 ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
 const k=e.key.length===1?e.key.toLowerCase():e.key;
 if(keys[k]){e.preventDefault();turn(...keys[k]);}
 if(e.code==="Space"){e.preventDefault();pauseGame();}
});

function step(){
 if(!running)return;
 const head={x:snake[0].x+dx,y:snake[0].y+dy};
 const eating=head.x===food.x&&head.y===food.y;
 const body=eating?snake:snake.slice(0,-1);
 if(head.x<0||head.x>=N||head.y<0||head.y>=N||
    body.some(p=>p.x===head.x&&p.y===head.y)){
  gameOver();return;
 }
 snake.unshift(head);
 if(eating){
  score+=10;eaten++;
  updateStats();
  if(score>best){best=score;
   localStorage.setItem("adityaRainbowBest",best);
   document.getElementById("best").textContent=best;}
  if(snake.length===N*N){gameOver(true);return;}
  placeFood();
  if(eaten%5===0){
   clearInterval(timer);
   timer=setInterval(step,Math.max(55,125-eaten*2));
   document.getElementById("message").textContent="🔥 शानदार! 5 फल खा लिए!";
  }
 }else snake.pop();
 draw();
}

function updateStats(){
 document.getElementById("score").textContent=score;
 document.getElementById("eaten").textContent=eaten;
}
function gameOver(won=false){
 clearInterval(timer);running=false;paused=false;ended=true;draw();
 ctx.fillStyle="#000b";ctx.fillRect(35,155,350,110);
 ctx.textAlign="center";ctx.fillStyle=won?"#68ffb5":"#ff6a91";
 ctx.font="bold 27px Arial";
 ctx.fillText(won?"YOU WIN! 🏆":"GAME OVER!",210,198);
 ctx.fillStyle="white";ctx.font="18px Arial";
 ctx.fillText("स्कोर: "+score+" • रीस्टार्ट दबाओ",210,232);
 document.getElementById("message").textContent=
 won?"बहुत बढ़िया! पूरा बोर्ड भर दिया!":"फिर से कोशिश करो! 💪";
}

function draw(){
 ctx.fillStyle=backgrounds[Math.floor(eaten/5)%backgrounds.length];
 ctx.fillRect(0,0,420,420);
 ctx.strokeStyle="#ffffff0c";ctx.lineWidth=1;
 for(let i=0;i<=N;i++){
  ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,420);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(420,i*C);ctx.stroke();
 }
 if(food){
  ctx.save();
  ctx.shadowColor=food.color;ctx.shadowBlur=20;
  ctx.font="25px Arial";ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(food.emoji,food.x*C+C/2,food.y*C+C/2);
  ctx.restore();
 }
 const color=document.getElementById("snakeColor").value;
 snake?.forEach((p,i)=>{
  const hue=(i*13+Date.now()/35)%360;
  ctx.save();
  ctx.shadowBlur=i===0?16:7;
  ctx.shadowColor=color==="rainbow"?`hsl(${hue},100%,60%)`:color;
  ctx.fillStyle=color==="rainbow"?`hsl(${hue},100%,58%)`:color;
  ctx.beginPath();
  ctx.roundRect(p.x*C+2,p.y*C+2,C-4,C-4,6);
  ctx.fill();
  if(i===0){
   ctx.fillStyle="#071520";
   const ex=p.x*C+C/2+(dx===-1?-4:dx===1?4:0);
   const ey=p.y*C+C/2+(dy===-1?-4:dy===1?4:0);
   ctx.beginPath();ctx.arc(ex-3,ey-3,2,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(ex+3,ey-3,2,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
 });
}
draw();
</script>
</body>
</html>
